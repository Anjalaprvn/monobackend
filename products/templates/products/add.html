{% extends 'base.html' %}

{% block title %}Create New {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Add New {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="productForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Name, Category, Active -->
    <div class="form-row form-row-3">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" id="category" name="category">
      </div>
      <div class="form-group">
        <label class="form-label">Active</label>
        <select class="form-control form-select" id="is_active" name="is_active">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
    </div>

    <!-- Row 2: Price, Stock Quantity -->
    <div class="form-row">
      <div class="form-group form-group-sm">
        <label class="form-label">Price <span class="required">*</span></label>
        <input type="number" step="0.01" class="form-control" id="price" name="price" required>
      </div>
      <div class="form-group form-group-sm">
        <label class="form-label">Stock Quantity</label>
        <input type="number" class="form-control" id="stock_quantity" name="stock_quantity" value="0">
      </div>
    </div>

    <!-- Row 3: SKU -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">SKU</label>
        <input type="text" class="form-control" id="sku" name="sku" placeholder="Stock Keeping Unit">
      </div>
    </div>

    <!-- Row 4: Description -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Description <span class="required">*</span></label>
        <textarea class="form-control form-textarea" id="description" name="description" rows="5" required></textarea>
      </div>
    </div>

    <!-- Row 5: Media Upload -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Product Image</label>
        <div class="media-upload-container">
          <div class="media-preview-single" id="mediaPreview">
            <!-- Preview will be shown here -->
          </div>
          <label class="media-upload-box" id="uploadBox" for="image">
            <div class="upload-icon">
              <i class="bi bi-cloud-arrow-up"></i>
            </div>
            <div class="upload-text">
              <span class="upload-title">Drop/Click to upload</span>
              <span class="upload-hint">IMAGE* up to 10MB</span>
            </div>
            <input type="file" id="image" name="image" accept="image/*" hidden>
          </label>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'products:product_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Save {{ model_name }}</button>
    </div>
  </form>
  
  <script>
    const mediaInput = document.getElementById('image');
    const mediaPreview = document.getElementById('mediaPreview');
    const uploadBox = document.getElementById('uploadBox');
    let uploadedFile = null;

    mediaInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        setPreview(file);
      }
    });

    function setPreview(file) {
      uploadedFile = file;
      const reader = new FileReader();
      
      reader.onload = function(e) {
        mediaPreview.innerHTML = `
          <div class="media-preview-item">
            <img src="${e.target.result}" alt="${file.name}">
            <button type="button" class="media-remove-btn" onclick="removeMedia()">
              <i class="bi bi-trash3"></i>
            </button>
            <span class="media-filename">${file.name}</span>
          </div>
        `;
        uploadBox.style.display = 'none';
      };
      
      reader.readAsDataURL(file);
    }

    function removeMedia() {
      mediaPreview.innerHTML = '';
      uploadedFile = null;
      mediaInput.value = '';
      uploadBox.style.display = 'flex';
    }

    // Drag and drop support
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      uploadBox.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadBox.addEventListener(eventName, () => uploadBox.classList.add('drag-over'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('drag-over'), false);
    });

    uploadBox.addEventListener('drop', function(e) {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        setPreview(file);
      }
    });

    // Handle form submission
    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Prepare data for API
      const data = {
        name: formData.get('name'),
        category: formData.get('category') || '',
        price: parseFloat(formData.get('price')),
        stock_quantity: parseInt(formData.get('stock_quantity')) || 0,
        sku: formData.get('sku') || '',
        description: formData.get('description'),
        is_active: formData.get('is_active') === 'true'
      };
      
      try {
        // Create a new FormData to send the file along with the data
        const submitFormData = new FormData();
        for (const key in data) {
          submitFormData.append(key, data[key]);
        }
        
        // Add the image file if one was selected
        if (uploadedFile) {
          submitFormData.append('image', uploadedFile);
        }
        
        const response = await fetch('{% url "products:create_product" %}', {
          method: 'POST',
          headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: submitFormData
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Product created successfully!');
          // Redirect to products list page
          window.location.href = '{% url "products:product_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to create product.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while creating the product.');
      }
    });
  </script>
</div>
{% endblock %}
