{% extends 'base.html' %}

{% block title %}Edit {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Edit {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="galleryForm" class="blog-form" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ item.id }}">

    <!-- Row 1 -->
    <div class="form-row form-row-3">
      <div class="form-group">
        <label class="form-label">Title <span class="required">*</span></label>
        <input type="text" class="form-control" name="title" id="title" value="{{ item.title }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" name="category" value="{{ item.category }}">
      </div>
      <div class="form-group">
        <label class="form-label">Active</label>
        <select class="form-control form-select" name="is_active">
          <option value="true" {% if item.is_active %}selected{% endif %}>Yes</option>
          <option value="false" {% if not item.is_active %}selected{% endif %}>No</option>
        </select>
      </div>
    </div>



    <!-- Existing Images -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Existing Images</label>
        <div class="media-preview-horizontal" id="existingMediaPreview">
          {% for image in item.images.all %}
            <div class="media-preview-item" data-image-id="{{ image.id }}">
              <img src="{{ image.image.url }}" alt="{{ image.caption|default:image.image.name }}">
              <button type="button" class="media-remove-btn" onclick="removeExistingImage('{{ image.id }}')">&times;</button>
              <span class="media-filename">{{ image.image.name }}</span>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- New Images Upload -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Add New Images</label>

        <div class="media-upload-container">
          <div class="media-preview-horizontal" id="newMediaPreview"></div>

          <div class="upload-controls">
            <label class="media-upload-box" id="uploadBox" for="newImages">
              <div class="upload-icon">
                <i class="bi bi-cloud-arrow-up"></i>
              </div>
              <div class="upload-text">
                <span class="upload-title">Drop / Click to upload</span>
                <span class="upload-hint">Screenshots & Images up to 10MB (multiple allowed)</span>
              </div>
              <input type="file" id="newImages" name="images" accept="image/*" multiple hidden>
            </label>

            <button type="button" class="add-more-btn" id="addMoreBtn"
              onclick="document.getElementById('newImages').click()">
              <i class="bi bi-plus-lg"></i> Add More Images
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a href="{% url 'gallery:gallery_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Update {{ model_name }}</button>
    </div>
  </form>

  <!-- ================= JS ================= -->
  <script>
    const newMediaInput = document.getElementById('newImages');
    const newMediaPreview = document.getElementById('newMediaPreview');
    const uploadBox = document.getElementById('uploadBox');
    const addMoreBtn = document.getElementById('addMoreBtn');

    let uploadedFiles = [];

    newMediaInput.addEventListener('change', function (e) {
      Array.from(e.target.files).forEach(file => {
        if (
          file.type.startsWith('image/') &&
          !uploadedFiles.some(f => f.name === file.name && f.size === file.size)
        ) {
          setNewPreview(file);
        }
      });
    });

    function setNewPreview(file) {
      uploadedFiles.push(file);

      const reader = new FileReader();
      reader.onload = function (e) {
        const div = document.createElement('div');
        div.className = 'media-preview-item';
        div.dataset.filename = file.name;

        div.innerHTML = `
          <img src="${e.target.result}">
          <button type="button" class="media-remove-btn"
            onclick="removeNewMedia('${file.name}')">&times;</button>
          <span class="media-filename">${file.name}</span>
        `;
        newMediaPreview.appendChild(div);
      };
      reader.readAsDataURL(file);

      uploadBox.style.display = 'none';
      addMoreBtn.style.display = 'flex';
    }

    function removeNewMedia(filename) {
      uploadedFiles = uploadedFiles.filter(f => f.name !== filename);

      document.querySelectorAll('#newMediaPreview .media-preview-item').forEach(item => {
        if (item.dataset.filename === filename) item.remove();
      });

      if (uploadedFiles.length === 0) {
        uploadBox.style.display = 'flex';
        addMoreBtn.style.display = 'none';
      }
    }

    function removeExistingImage(imageId) {
      if (confirm('Are you sure you want to remove this image?')) {
        // Mark the image for removal by adding a hidden input
        const removeInput = document.createElement('input');
        removeInput.type = 'hidden';
        removeInput.name = 'remove_image_ids';
        removeInput.value = imageId;
        document.getElementById('galleryForm').appendChild(removeInput);
        
        // Remove the preview element
        document.querySelector(`[data-image-id="${imageId}"]`).remove();
      }
    }

    // Drag & Drop
    ['dragenter','dragover','dragleave','drop'].forEach(ev =>
      uploadBox.addEventListener(ev, e => {
        e.preventDefault(); e.stopPropagation();
      })
    );

    uploadBox.addEventListener('drop', e => {
      Array.from(e.dataTransfer.files).forEach(file => {
        if (
          file.type.startsWith('image/') &&
          !uploadedFiles.some(f => f.name === file.name && f.size === file.size)
        ) {
          setNewPreview(file);
        }
      });
    });

    // Submit
    document.getElementById('galleryForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      // Require at least a title to be entered
      const title = document.getElementById('title').value.trim();
      if (!title) {
        alert('Please enter a title for the gallery item.');
        return;
      }

      const fd = new FormData(this);
      
      // Add the gallery ID to the form data
      fd.append('id', '{{ gallery.id }}');
      
      uploadedFiles.forEach(file => fd.append('images', file, file.name));

      const res = await fetch('{% url "gallery:update_gallery_item" item.id %}', {
        method: 'PUT',
        headers: {
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: fd
      });

      const data = await res.json();
      if (res.ok && data.success) {
        window.location.href = '{% url "gallery:gallery_list" %}';
      } else {
        alert('Error: ' + JSON.stringify(data));
      }
    });
  </script>

  <!-- ================= CSS ================= -->
  <style>
    .media-preview-horizontal { display:flex; gap:1rem; flex-wrap:wrap; }
    .media-preview-item { width:150px; height:150px; position:relative; }
    .media-preview-item img { width:100%; height:100%; object-fit:cover; }
    .media-remove-btn {
      position:absolute; top:5px; right:5px;
      background:#dc3545; color:#fff; border:none; border-radius:50%;
      width:24px; height:24px; cursor:pointer;
    }
    .media-filename {
      position:absolute; bottom:0; left:0; right:0;
      background:rgba(0,0,0,.6); color:#fff; font-size:11px; text-align:center;
    }
    .add-more-btn { display:none; background:#28a745; color:#fff; border:none; padding:10px; }
  </style>
</div>
{% endblock %}
