{% extends 'base.html' %}

{% block title %}Edit {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Edit {{ model_name }}</h2>
    <a href="{% url 'booking:booking_list' %}" class="btn-close" aria-label="Close"></a>
  </div>

  <form id="bookingForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Name -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" value="{{ booking.name }}" required>
      </div>
    </div>

    <!-- Row 2: Email and Phone -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" class="form-control" id="email" name="email" value="{{ booking.email }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone <span class="required">*</span></label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ booking.phone }}" required>
      </div>
    </div>

    <!-- Row 3: Slot Selection -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Slot <span class="required">*</span></label>
        <select class="form-control form-select" id="slot" name="slot" required>
          {% for slot in available_slots %}
            <option value="{{ slot.id }}" {% if slot.id == booking.slot.id %}selected{% endif %}>
              {{ slot.name }} - {{ slot.date|date:"M d, Y" }} ({{ slot.start_time|time:"g:i A" }} - {{ slot.end_time|time:"g:i A" }})
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Row 4: Notes -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-control form-textarea" id="notes" name="notes" rows="5">{{ booking.notes }}</textarea>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'booking:booking_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">
        <i class="fas fa-save"></i> Update {{ model_name }}
      </button>
    </div>
  </form>
  
  <script>
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Prepare data for API
      const data = {
        name: formData.get('name'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        slot: formData.get('slot'),
        notes: formData.get('notes')
      };
      
      try {
        const response = await fetch('{% url "booking:update_booking_api" booking.pk %}', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Booking updated successfully!');
          // Redirect to booking list page
          window.location.href = '{% url "booking:booking_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to update booking.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while updating the booking.');
      }
    });
  </script>
  
</div>
{% endblock %}
