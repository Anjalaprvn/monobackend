{% extends 'base.html' %}

{% block title %}Create New {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Add New {{ model_name }}</h2>
    <a href="{% url 'booking:booking_list' %}" class="btn-close" aria-label="Close"></a>
  </div>

  <form id="bookingForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Name -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
    </div>

    <!-- Row 2: Email and Phone -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone <span class="required">*</span></label>
        <input type="text" class="form-control" id="phone" name="phone" required>
      </div>
    </div>

    <!-- Row 3: Date Selection -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date <span class="required">*</span></label>
        <input type="date" class="form-control" id="date" name="date" value="{{ selected_date }}" required>
      </div>
    </div>

    <!-- Row 4: Slot Selection -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Available Slots <span class="required">*</span></label>
        <div id="slots-container" class="slots-buttons-container">
          <div class="slots-placeholder" id="slots-placeholder">
            Select a date to see available slots
          </div>
          <div class="slots-buttons" id="slots-buttons" style="display: none;"></div>
          <input type="hidden" id="slot" name="slot" required>
        </div>
        <small class="form-text text-muted">First select a date to see available slots</small>
      </div>
    </div>

    <!-- Row 4: Notes -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-control form-textarea" id="notes" name="notes" rows="5"></textarea>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'booking:booking_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">
        <i class="fas fa-save"></i> Save {{ model_name }}
      </button>
    </div>
  </form>
  
  <script>
    // Handle date change to load available slots
    document.getElementById('date').addEventListener('change', async function() {
      const selectedDate = this.value;
      const slotsPlaceholder = document.getElementById('slots-placeholder');
      const slotsButtons = document.getElementById('slots-buttons');
      const slotInput = document.getElementById('slot');
      
      if (!selectedDate) {
        slotsPlaceholder.style.display = 'block';
        slotsButtons.style.display = 'none';
        slotsButtons.innerHTML = '';
        slotInput.value = '';
        return;
      }
      
      try {
        const response = await fetch(`/booking/api/bookings/available-slots/?date=${selectedDate}`);
        const result = await response.json();
        
        if (result.success && result.count > 0) {
          // Create slot buttons
          let buttonsHtml = '';
          result.slots.forEach(slot => {
            // Convert 24-hour time to 12-hour format
            const formatTime = (time24) => {
              const [hours, minutes] = time24.split(':').map(Number);
              const period = hours >= 12 ? 'PM' : 'AM';
              const displayHours = hours % 12 || 12;
              return `${displayHours}:${minutes.toString().padStart(2, '0')} ${period}`;
            };
            const startTime12 = formatTime(slot.start_time);
            const endTime12 = formatTime(slot.end_time);
            
            buttonsHtml += `
              <button type="button" class="slot-button" data-slot-id="${slot.id}" data-slot-name="${slot.name}">
                ${startTime12} - ${endTime12}
              </button>
            `;
          });
          
          slotsButtons.innerHTML = buttonsHtml;
          slotsPlaceholder.style.display = 'none';
          slotsButtons.style.display = 'grid';
          slotInput.value = '';
          
          // Add click handlers to slot buttons
          document.querySelectorAll('.slot-button').forEach(button => {
            button.addEventListener('click', function() {
              // Remove active class from all buttons
              document.querySelectorAll('.slot-button').forEach(btn => {
                btn.classList.remove('active');
              });
              
              // Add active class to clicked button
              this.classList.add('active');
              
              // Set the hidden input value
              slotInput.value = this.dataset.slotId;
            });
          });
          
        } else {
          slotsPlaceholder.innerHTML = 'No available slots for this date';
          slotsPlaceholder.style.display = 'block';
          slotsButtons.style.display = 'none';
          slotsButtons.innerHTML = '';
          slotInput.value = '';
        }
      } catch (error) {
        console.error('Error loading slots:', error);
        slotsPlaceholder.innerHTML = 'Error loading slots';
        slotsPlaceholder.style.display = 'block';
        slotsButtons.style.display = 'none';
        slotsButtons.innerHTML = '';
        slotInput.value = '';
      }
    });
    
    // Handle form submission
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Prepare data for API
      const data = {
        name: formData.get('name'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        slot: formData.get('slot'),
        notes: formData.get('notes')
      };
      
      try {
        const response = await fetch('{% url "booking:create_booking_api" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Booking created successfully!');
          // Redirect to booking list page
          window.location.href = '{% url "booking:booking_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to create booking.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while creating the booking.');
      }
    });
    
    // Trigger slot loading if date is pre-filled
    document.addEventListener('DOMContentLoaded', function() {
      const dateInput = document.getElementById('date');
      if (dateInput.value) {
        // Dispatch change event to load slots
        dateInput.dispatchEvent(new Event('change'));
      }
    });
  </script>
  
  <style>
    .slots-buttons-container {
      min-height: 100px;
    }
    
    .slots-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      background-color: #f8f9fa;
      border: 2px dashed #dee2e6;
      border-radius: 8px;
      color: #6c757d;
      font-style: italic;
    }
    
    .slots-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    
    .slot-button {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      font-weight: 500;
    }
    
    .slot-button:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
    }
    
    .slot-button.active {
      border-color: #667eea;
      background-color: #eef0ff;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
    }
    
    .slot-button.active::after {
      content: '✓';
      position: absolute;
      top: -8px;
      right: -8px;
      background: #667eea;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    

    
    @media (max-width: 768px) {
      .slots-buttons {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.75rem;
      }
      
      .slot-button {
        padding: 0.75rem;
      }
    }
  </style>
  
</div>
{% endblock %}
