{% extends 'base.html' %}

{% block title %}Create New {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Add New {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="slotForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Date -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date <span class="required">*</span></label>
        <input type="date" class="form-control" id="date" name="date" required>
      </div>
    </div>

    <!-- Row 2: Start Time, End Time -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Start Time <span class="required">*</span></label>
        <input type="time" class="form-control" id="start_time" name="start_time" required>
      </div>
      <div class="form-group">
        <label class="form-label">End Time <span class="required">*</span></label>
        <input type="time" class="form-control" id="end_time" name="end_time" required>
      </div>
    </div>

    <!-- Row 3: Status -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status <span class="required">*</span></label>
        <select class="form-control form-select" id="status" name="status" required>
          <option value="available">Available</option>
          <option value="booked">Booked</option>
        </select>
      </div>
    </div>

    <!-- Customer Details (shown only when status is booked) -->
    <div id="customerDetails" style="display: none;">
      <!-- Row 4: Customer Name -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Customer Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="booked_by" name="booked_by" placeholder="Enter customer name">
        </div>
      </div>
      
      <!-- Row 5: Customer Email and Phone -->
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter customer email">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter customer phone">
        </div>
      </div>
      

    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'slots:slot_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">
        <i class="fas fa-save"></i> Save {{ model_name }}
      </button>
    </div>
  </form>
  
  <script>
    // Show/hide customer details based on status
    document.getElementById('status').addEventListener('change', function() {
      const status = this.value;
      const customerDetails = document.getElementById('customerDetails');
      
      if (status === 'booked') {
        customerDetails.style.display = 'block';
      } else {
        customerDetails.style.display = 'none';
      }
    });
    
    // Auto-set end time 30 minutes after start time
    document.getElementById('start_time').addEventListener('change', function() {
      const startTime = this.value;
      const endTimeInput = document.getElementById('end_time');
      
      if (startTime) {
        // Parse the start time
        const [hours, minutes] = startTime.split(':').map(Number);
        
        // Add 30 minutes
        let endHours = hours;
        let endMinutes = minutes + 30;
        
        // Handle minute overflow
        if (endMinutes >= 60) {
          endMinutes -= 60;
          endHours += 1;
          
          // Handle hour overflow (24-hour format)
          if (endHours >= 24) {
            endHours -= 24;
          }
        }
        
        // Format as HH:MM
        const formattedEndHours = endHours.toString().padStart(2, '0');
        const formattedEndMinutes = endMinutes.toString().padStart(2, '0');
        
        endTimeInput.value = `${formattedEndHours}:${formattedEndMinutes}`;
      }
    });
    
    document.getElementById('slotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Generate a name based on the time range
      const date = formData.get('date');
      const startTime = formData.get('start_time');
      const endTime = formData.get('end_time');
      
      // Convert time to readable format
      const formatTime = (time) => {
        const [hours, minutes] = time.split(':');
        const hour = parseInt(hours);
        const period = hour >= 12 ? 'PM' : 'AM';
        const displayHour = hour > 12 ? hour - 12 : hour === 0 ? 12 : hour;
        return `${displayHour}:${minutes} ${period}`;
      };
      
      const formattedStartTime = formatTime(startTime);
      const formattedEndTime = formatTime(endTime);
      const formattedDate = new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      
      const name = `Slot ${formattedDate} ${formattedStartTime}-${formattedEndTime}`;
      
      // Prepare data for API
      const data = {
        date: formData.get('date'),
        start_time: formData.get('start_time'),
        end_time: formData.get('end_time'),
        status: formData.get('status'),
        name: name
      };
      
      // Add customer details if status is booked
      const status = formData.get('status');
      if (status === 'booked') {
        data.booked_by = formData.get('booked_by');
        data.email = formData.get('email');
        data.phone = formData.get('phone');
        
        // Validation for required customer fields when booked
        if (!data.booked_by.trim()) {
          alert('Customer name is required when status is booked.');
          return;
        }
      }
      
      try {
        const response = await fetch('{% url "slots:create_slot_api" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Slot created successfully!');
          // Redirect to slot list page
          window.location.href = '{% url "slots:slot_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to create slot.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while creating the slot.');
      }
    });
  </script>
</div>
{% endblock %}
