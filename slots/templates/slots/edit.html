{% extends 'base.html' %}

{% block title %}Edit {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Edit {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="slotForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Date -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date <span class="required">*</span></label>
        <input type="date" class="form-control" id="date" name="date" value="{{ slot.date|date:'Y-m-d' }}" required>
      </div>
    </div>

    <!-- Row 2: Start Time, End Time -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Start Time <span class="required">*</span></label>
        <input type="time" class="form-control" id="start_time" name="start_time" value="{{ slot.start_time|time:'H:i' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">End Time <span class="required">*</span></label>
        <input type="time" class="form-control" id="end_time" name="end_time" value="{{ slot.end_time|time:'H:i' }}" required>
      </div>
    </div>

    <!-- Row 3: Status -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status <span class="required">*</span></label>
        <select class="form-control form-select" id="status" name="status" required>
          <option value="available" {% if slot.status == 'available' %}selected{% endif %}>Available</option>
          <option value="booked" {% if slot.status == 'booked' %}selected{% endif %}>Booked</option>
          <option value="maintenance" {% if slot.status == 'maintenance' %}selected{% endif %}>Maintenance</option>
        </select>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'slots:slot_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Update {{ model_name }}</button>
    </div>
  </form>
  
  <script>
    document.getElementById('slotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Generate a name based on the time range
      const date = formData.get('date');
      const startTime = formData.get('start_time');
      const endTime = formData.get('end_time');
      
      // Convert time to readable format
      const formatTime = (time) => {
        const [hours, minutes] = time.split(':');
        const hour = parseInt(hours);
        const period = hour >= 12 ? 'PM' : 'AM';
        const displayHour = hour > 12 ? hour - 12 : hour === 0 ? 12 : hour;
        return `${displayHour}:${minutes} ${period}`;
      };
      
      const formattedStartTime = formatTime(startTime);
      const formattedEndTime = formatTime(endTime);
      const formattedDate = new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      
      const name = `Slot ${formattedDate} ${formattedStartTime}-${formattedEndTime}`;
      
      // Prepare data for API
      const data = {
        date: formData.get('date'),
        start_time: formData.get('start_time'),
        end_time: formData.get('end_time'),
        status: formData.get('status'),
        name: name
      };
      
      try {
        const response = await fetch('{% url "slots:update_slot_api" slot.id %}', {
          method: 'PUT',
          headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Slot updated successfully!');
          // Redirect to slots list page
          window.location.href = '{% url "slots:slot_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to update slot.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while updating the slot.');
      }
    });
  </script>
</div>
{% endblock %}
