{% extends 'base.html' %}

{% block title %}Book Slot - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Book Slot: {{ slot.name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <div class="blog-form">
    <!-- Slot Information -->
    <div class="section-header">
      <h3>Slot Details</h3>
    </div>
    
    <div class="slot-info-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="text" class="form-control" value="{{ slot.date|date:'l, F j, Y' }}" readonly>
        </div>
      </div>

      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Start Time</label>
          <input type="text" class="form-control" value="{{ slot.start_time|time:'g:i A' }}" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">End Time</label>
          <input type="text" class="form-control" value="{{ slot.end_time|time:'g:i A' }}" readonly>
        </div>
      </div>
    </div>

    <!-- Booking Form -->
    <div class="section-header mt-4">
      <h3>Customer Information</h3>
    </div>

    <form id="bookingForm">
      {% csrf_token %}
      
      <!-- Row 1: Name, Email -->
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Customer Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="customer_name" name="name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email <span class="required">*</span></label>
          <input type="email" class="form-control" id="customer_email" name="email" required>
        </div>
      </div>

      <!-- Row 2: Phone -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone <span class="required">*</span></label>
          <input type="tel" class="form-control" id="customer_phone" name="phone" required>
        </div>
      </div>

      <!-- Row 3: Notes -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-control form-textarea" id="customer_notes" name="notes" rows="3" placeholder="Additional notes about this booking..."></textarea>
        </div>
      </div>

      <!-- Booking Actions -->
      <div class="form-actions">
        <a href="{% url 'slots:slot_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">
          <i class="fas fa-calendar-check"></i> Confirm Booking
        </button>
      </div>
    </form>
  </div>
</div>

<style>
.section-header {
  border-bottom: 2px solid #e9ecef;
  padding-bottom: 0.5rem;
  margin-bottom: 1.5rem;
}

.section-header h3 {
  margin: 0;
  color: #495057;
  font-weight: 600;
}

.slot-info-card {
  background-color: #f8f9fa;
  padding: 1.5rem;
  border-radius: 8px;
  border-left: 4px solid #28a745;
}

.mt-4 {
  margin-top: 2rem;
}
</style>

<script>
document.getElementById('bookingForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const formData = new FormData(this);
  
  // Prepare data for API
  const data = {
    name: formData.get('name'),
    email: formData.get('email'),
    phone: formData.get('phone'),
    notes: formData.get('notes') || '',
    slot_id: '{{ slot.id }}'
  };
  
  try {
    const response = await fetch('{% url "slots:book_slot_api" slot.id %}', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
      },
      body: JSON.stringify(data)
    });
    
    const result = await response.json();
    
    if (response.ok && result.success) {
      // Show success message
      alert('Slot booked successfully!');
      // Redirect to slot list page
      window.location.href = '{% url "slots:slot_list" %}';
    } else {
      // Show error message
      let errorMessage = 'Failed to book slot.';
      if (result.error) {
        errorMessage += ' Error: ' + result.error;
      }
      alert(errorMessage);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('An error occurred while booking the slot.');
  }
});
</script>
{% endblock %}
