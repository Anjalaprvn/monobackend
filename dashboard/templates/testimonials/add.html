{% extends 'base.html' %}

{% block title %}Create New Testimonial - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Add New Testimonial</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="testimonialForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Name, Designation, Company -->
    <div class="form-row form-row-3">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Designation</label>
        <input type="text" class="form-control" id="designation" name="designation">
      </div>
      <div class="form-group">
        <label class="form-label">Company</label>
        <input type="text" class="form-control" id="company" name="company">
      </div>
    </div>

    <!-- Row 2: Rating, Active -->
    <div class="form-row">
      <div class="form-group form-group-sm">
        <label class="form-label">Rating <span class="required">*</span></label>
        <select class="form-control form-select" id="rating" name="rating" required>
          <option value="">Select Rating</option>
          <option value="1">1 Star</option>
          <option value="2">2 Stars</option>
          <option value="3">3 Stars</option>
          <option value="4">4 Stars</option>
          <option value="5">5 Stars</option>
        </select>
      </div>
      <div class="form-group form-group-sm">
        <label class="form-label">Active</label>
        <select class="form-control form-select" id="is_active" name="is_active">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
    </div>

    <!-- Row 3: Message -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Message <span class="required">*</span></label>
        <textarea class="form-control form-textarea" id="message" name="message" rows="5" required></textarea>
      </div>
    </div>

    <!-- Row 4: Image Upload -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Profile Image</label>
        <div class="media-upload-container">
          <div class="media-preview-single" id="mediaPreview">
            <!-- Preview will be shown here -->
          </div>
          <label class="media-upload-box" id="uploadBox" for="image">
            <div class="upload-icon">
              <i class="bi bi-cloud-arrow-up"></i>
            </div>
            <div class="upload-text">
              <span class="upload-title">Drop/Click to upload</span>
              <span class="upload-hint">IMAGE* up to 10MB</span>
            </div>
            <input type="file" id="image" name="image" accept="image/*" hidden>
          </label>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'dashboard:testimonial_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Save Testimonial</button>
    </div>
  </form>
  
  <script>
    const mediaInput = document.getElementById('image');
    const mediaPreview = document.getElementById('mediaPreview');
    const uploadBox = document.getElementById('uploadBox');
    let uploadedFile = null;

    mediaInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        setPreview(file);
      }
    });

    function setPreview(file) {
      uploadedFile = file;
      const reader = new FileReader();
      
      reader.onload = function(e) {
        mediaPreview.innerHTML = `
          <div class="media-preview-item">
            <img src="${e.target.result}" alt="${file.name}">
            <button type="button" class="media-remove-btn" onclick="removeMedia()">
              <i class="bi bi-trash3"></i>
            </button>
            <span class="media-filename">${file.name}</span>
          </div>
        `;
        uploadBox.style.display = 'none';
      };
      
      reader.readAsDataURL(file);
    }

    function removeMedia() {
      mediaPreview.innerHTML = '';
      uploadedFile = null;
      mediaInput.value = '';
      uploadBox.style.display = 'flex';
    }

    // Drag and drop support
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      uploadBox.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadBox.addEventListener(eventName, () => uploadBox.classList.add('drag-over'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('drag-over'), false);
    });

    uploadBox.addEventListener('drop', function(e) {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        setPreview(file);
      }
    });

    // Handle form submission
    document.getElementById('testimonialForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      try {
        const response = await fetch('{% url "dashboard:api_testimonials_create" %}', {
          method: 'POST',
          headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: formData
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Testimonial created successfully!');
          // Redirect to testimonials list page
          window.location.href = '{% url "dashboard:testimonial_management" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to create testimonial.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while creating the testimonial.');
      }
    });
  </script>
</div>
{% endblock %}
