  <!-- Collapse Button -->
  <button class="sidebar-collapse" id="sidebarCollapse">
    <span class="collapse-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6l-6 6l6 6"/>
      </svg>
    </span>
    <span class="collapse-text">Collapse</span>
  </button>

  <style>
    /* Existing styles */
    .sidebar-brand {
      display: flex;
      align-items: center;
      padding: 1.5rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      gap: 1rem;
    }
    
    .brand-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    
    .brand-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      line-height: 1.2;
    }
    
    .brand-subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.2;
    }

    /* Navigation container with scroll */
    .sidebar-nav-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
      margin-bottom: 4rem; /* Space for collapse button */
    }

    /* Collapse button styles */
    .sidebar-collapse {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }
    
    .sidebar-collapse:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .collapse-text {
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* Scrollbar styling */
    .sidebar-nav-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .sidebar-nav-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    .sidebar-nav-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    
    .sidebar-nav-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>

  <!-- Theme Styles -->
  <style id="themeStyles">
    /* Default Theme */
    .sidebar {
      background: linear-gradient(180deg, #295640 0%, #1e4230 100%);
    }
    
    /* Dark Theme */
    .sidebar[data-theme="dark"] {
      background: linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%);
    }
    
    /* Blue Theme */
    .sidebar[data-theme="blue"] {
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
    }
    
    /* Green Theme */
    .sidebar[data-theme="green"] {
      background: linear-gradient(180deg, #2e7d32 0%, #388e3c 100%);
    }
    
    /* Original Theme */
    .sidebar[data-theme="original"] {
      background: linear-gradient(180deg, #1e4230 0%, #1e4230 100%);
    }
  </style>
</aside>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const sidebarCollapse = document.getElementById('sidebarCollapse');
  const sidebar = document.querySelector('.sidebar');
  const sidebarLogo = document.getElementById('sidebarLogo');
  
  sidebarCollapse.addEventListener('click', function() {
    sidebar.classList.toggle('collapsed');
  });
  
  // Listen for logo updates from dashboard settings
  window.addEventListener('message', function(event) {
    if (event.data.type === 'UPDATE_LOGO') {
      sidebarLogo.src = event.data.logoUrl;
      sidebarLogo.alt = event.data.logoAlt || 'Vastu Farms';
    }
    
    if (event.data.type === 'UPDATE_THEME') {
      sidebar.setAttribute('data-theme', event.data.theme);
    }
  });
  
  // Check for saved theme in localStorage
  const savedTheme = localStorage.getItem('dashboardTheme');
  if (savedTheme) {
    sidebar.setAttribute('data-theme', savedTheme);
  }
  
  // Check for saved logo in localStorage
  const savedLogo = localStorage.getItem('dashboardLogo');
  if (savedLogo) {
    sidebarLogo.src = savedLogo;
  }
});
</script>
