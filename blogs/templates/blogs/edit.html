{% extends 'base.html' %}

{% block title %}Edit Post - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Edit Blog Post</h2>
    <a href="{% url 'blogs:blog_list' %}" class="btn-close" aria-label="Close"></a>
  </div>

  <form class="blog-form" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Row 1: Title & Status -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Title <span class="required">*</span></label>
        <input type="text"
               class="form-control"
               name="title"
               value="{{ blog.title }}"
               required>
      </div>

      <div class="form-group">
        <label class="form-label">Status <span class="required">*</span></label>
        <select class="form-control form-select" name="status" required>
          <option value="draft" {% if blog.status == 'draft' %}selected{% endif %}>Draft</option>
          <option value="published" {% if blog.status == 'published' %}selected{% endif %}>Published</option>
        </select>
      </div>
    </div>

    <!-- Short Description -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Short Description <span class="required">*</span></label>
        <textarea class="form-control form-textarea"
                  name="short_description"
                  rows="3"
                  required>{{ blog.short_description }}</textarea>
      </div>
    </div>

    <!-- Content -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Content <span class="required">*</span></label>
        <textarea class="form-control form-textarea"
                  name="content"
                  rows="10"
                  required>{{ blog.content }}</textarea>
      </div>
    </div>

    <!-- SEO -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">SEO Title</label>
        <input type="text"
               class="form-control"
               name="seo_title"
               value="{{ blog.seo_title }}">
      </div>

      <div class="form-group">
        <label class="form-label">SEO Description</label>
        <textarea class="form-control form-textarea"
                  name="seo_description"
                  rows="2">{{ blog.seo_description }}</textarea>
      </div>
    </div>

    <!-- Cover Image -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Cover Image</label>

        <div class="media-upload-container">
          <div class="media-preview-single" id="mediaPreview">
            {% if blog.cover_image %}
            <div class="media-preview-item">
              <img src="{{ blog.cover_image.url }}" alt="{{ blog.title }}">
              <span class="media-filename">Current Image</span>
            </div>
            {% endif %}
          </div>

          <label class="media-upload-box" id="uploadBox" for="mediaInput">
            <div class="upload-icon">
              <i class="bi bi-cloud-arrow-up"></i>
            </div>
            <div class="upload-text">
              <span class="upload-title">Drop/Click to upload</span>
              <span class="upload-hint">IMAGE* up to 10MB</span>
            </div>
            <input type="file" id="mediaInput" name="cover_image" accept="image/*" hidden>
          </label>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a href="{% url 'blogs:blog_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Update Post</button>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const mediaInput = document.getElementById('mediaInput');
  const mediaPreview = document.getElementById('mediaPreview');
  const uploadBox = document.getElementById('uploadBox');

  mediaInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        mediaPreview.innerHTML = `
          <div class="media-preview-item">
            <img src="${evt.target.result}">
            <span class="media-filename">${file.name}</span>
          </div>
        `;
      };
      reader.readAsDataURL(file);
    }
  });
</script>
{% endblock %}
