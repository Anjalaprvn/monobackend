{% extends 'base.html' %}

{% block title %}Create New Post - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Create New Post</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form class="blog-form" id="blogForm">
    {% csrf_token %}
    <!-- Row 1: Title, Status -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Title <span class="required">*</span></label>
        <input type="text" class="form-control" name="title" placeholder="Why East-Facing Plots Command Premium ..." required>
      </div>
      <div class="form-group">
        <label class="form-label">Status <span class="required">*</span></label>
        <select class="form-control form-select" name="status" required>
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
    </div>

    <!-- Row 2: Short Description -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Short Description <span class="required">*</span></label>
        <textarea class="form-control form-textarea" name="short_description" rows="3" placeholder="Brief summary of the blog post..." required></textarea>
      </div>
    </div>

    <!-- Row 3: Content -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Content <span class="required">*</span></label>
        <textarea class="form-control form-textarea" name="content" rows="10" placeholder="Full content of the blog post..." required></textarea>
      </div>
    </div>

    <!-- Row 4: SEO Information -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">SEO Title</label>
        <input type="text" class="form-control" name="seo_title" placeholder="SEO optimized title for search engines">
      </div>
      <div class="form-group">
        <label class="form-label">SEO Description</label>
        <textarea class="form-control form-textarea" name="seo_description" rows="2" placeholder="SEO meta description for search engines"></textarea>
      </div>
    </div>

    <!-- Row 5: Cover Image -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Cover Image</label>
        <div class="media-upload-container">
          <div class="media-preview-single" id="mediaPreview">
            <!-- Preview will be shown here -->
          </div>
          <label class="media-upload-box" id="uploadBox" for="mediaInput">
            <div class="upload-icon">
              <i class="bi bi-cloud-arrow-up"></i>
            </div>
            <div class="upload-text">
              <span class="upload-title">Drop/Click to upload</span>
              <span class="upload-hint">IMAGE* up to 10MB</span>
            </div>
            <input type="file" id="mediaInput" name="cover_image" accept="image/*" hidden>
          </label>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn-primary">Create Post</button>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const mediaInput = document.getElementById('mediaInput');
  const mediaPreview = document.getElementById('mediaPreview');
  const uploadBox = document.getElementById('uploadBox');
  let uploadedFile = null;

  mediaInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && file.type.startsWith('image/')) {
      setPreview(file);
    }
  });

  function setPreview(file) {
    uploadedFile = file;
    const reader = new FileReader();
    
    reader.onload = function(e) {
      mediaPreview.innerHTML = `
        <div class="media-preview-item">
          <img src="${e.target.result}" alt="${file.name}">
          <button type="button" class="media-remove-btn" onclick="removeMedia()">
            <i class="bi bi-trash3"></i>
          </button>
          <span class="media-filename">${file.name}</span>
        </div>
      `;
      uploadBox.style.display = 'none';
    };
    
    reader.readAsDataURL(file);
  }

  function removeMedia() {
    mediaPreview.innerHTML = '';
    uploadedFile = null;
    mediaInput.value = '';
    uploadBox.style.display = 'flex';
  }

  // Drag and drop support
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    uploadBox.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    uploadBox.addEventListener(eventName, () => uploadBox.classList.add('drag-over'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('drag-over'), false);
  });

  uploadBox.addEventListener('drop', function(e) {
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      setPreview(file);
    }
  });

  // Handle form submission
  document.getElementById('blogForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formElement = this;
    const formData = new FormData(formElement);
    
    // Handle file upload
    if (uploadedFile) {
      formData.set('cover_image', uploadedFile);
    }
    
    try {
      const response = await fetch('{% url "blogs:api_blog_create" %}', {
        method: 'POST',
        headers: {
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: formData
      });
      
      const result = await response.json();
      
      if (response.ok && result.success) {
        // Show success message
        alert('Blog post created successfully!');
        // Redirect to blogs list page
        window.location.href = '{% url "blogs:blog_list" %}';
      } else {
        // Show error message
        let errorMessage = 'Failed to create blog post.';
        if (result.details) {
          errorMessage += ' Details: ' + JSON.stringify(result.details);
        } else if (result.error) {
          errorMessage += ' Error: ' + result.error;
        }
        alert(errorMessage);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred while creating the blog post.');
    }
  });
</script>
{% endblock %}
