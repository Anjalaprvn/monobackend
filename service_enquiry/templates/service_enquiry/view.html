{% extends 'base.html' %}

{% block title %}{{ model_name }} Details - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">{{ model_name }} Details</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <div class="blog-form">
    <!-- Row 1: Name, Email -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" value="{{ enquiry.name }}" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ enquiry.email }}" readonly>
      </div>
    </div>

    <!-- Row 2: Phone -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="tel" class="form-control" value="{{ enquiry.phone }}" readonly>
      </div>
    </div>

    <!-- Row 3: Message -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-control form-textarea" rows="5" readonly>{{ enquiry.message }}</textarea>
      </div>
    </div>

    <!-- Row 4: Created At -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Created At</label>
        <input type="text" class="form-control" value="{{ enquiry.created_at|date:'M d, Y H:i' }}" readonly>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'service_enquiry:enquiry_list' %}" class="btn btn-secondary">Back to List</a>
    </div>
  </div>
</div>
{% endblock %}
