{% extends 'base.html' %}

{% block title %}Create New {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Add New {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="enquiryForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Service (conditionally shown), Name -->
    <div class="form-row {% if request.GET.service %}form-row-1{% else %}form-row-2{% endif %}">
      {% if not request.GET.service %}
      <div class="form-group">
        <label class="form-label">Service</label>
        <select class="form-control form-select" id="service" name="service">
          <option value="">-- Select a Service --</option>
          {% for service in services %}
          <option value="{{ service.id }}">{{ service.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
    </div>

    <!-- Row 2: Email, Phone -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone <span class="required">*</span></label>
        <input type="tel" class="form-control" id="phone" name="phone" required>
      </div>
    </div>

    <!-- Row 3: Message -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Message <span class="required">*</span></label>
        <textarea class="form-control form-textarea" id="message" name="message" rows="5" required></textarea>
      </div>
    </div>

    <!-- Hidden service field when pre-selected -->
    {% if request.GET.service %}
    <input type="hidden" name="service" value="{{ request.GET.service }}">
    {% endif %}

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url app_name|add:':'|add:'enquiry_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">
        <i class="fas fa-save"></i> Save {{ model_name }}
      </button>
    </div>
  </form>
  
  <script>
    document.getElementById('enquiryForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Prepare data for API
      const data = {
        service: formData.get('service'),
        name: formData.get('name'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        message: formData.get('message')
      };
      
      try {
        const response = await fetch('{% url "service_enquiry:create_enquiry_api" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Enquiry created successfully!');
          // Redirect to enquiry list page
          window.location.href = '{% url "service_enquiry:enquiry_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to create enquiry.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while creating the enquiry.');
      }
    });
  </script>
</div>
{% endblock %}
