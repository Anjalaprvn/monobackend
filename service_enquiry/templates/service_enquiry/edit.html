{% extends 'base.html' %}

{% block title %}Edit {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Edit {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="enquiryForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Name, Email -->
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" value="{{ enquiry.name }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" class="form-control" id="email" name="email" value="{{ enquiry.email }}" required>
      </div>
    </div>

    <!-- Row 2: Phone -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Phone <span class="required">*</span></label>
        <input type="tel" class="form-control" id="phone" name="phone" value="{{ enquiry.phone }}" required>
      </div>
    </div>

    <!-- Row 3: Message -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Message <span class="required">*</span></label>
        <textarea class="form-control form-textarea" id="message" name="message" rows="5" required>{{ enquiry.message }}</textarea>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'service_enquiry:enquiry_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Update {{ model_name }}</button>
    </div>
  </form>
  
  <script>
    document.getElementById('enquiryForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Prepare data for API
      const data = {
        name: formData.get('name'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        message: formData.get('message')
      };
      
      try {
        const response = await fetch('{% url "service_enquiry:update_enquiry_api" enquiry.id %}', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Enquiry updated successfully!');
          // Redirect to enquiry list page
          window.location.href = '{% url "service_enquiry:enquiry_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to update enquiry.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while updating the enquiry.');
      }
    });
  </script>
</div>
{% endblock %}
