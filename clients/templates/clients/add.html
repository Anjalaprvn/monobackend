{% extends 'base.html' %}

{% block title %}Create New {{ model_name }} - Vastu Farms{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2 class="form-card-title">Add New {{ model_name }}</h2>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>

  <form id="clientForm" class="blog-form">
    {% csrf_token %}
    <!-- Row 1: Name (required) -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
    </div>

    <!-- Row 2: Logo (optional) -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Logo</label>
        <input type="file" class="form-control" id="logo" name="logo" accept="image/*">
        <div class="form-text">Optional logo image for the client</div>
      </div>
    </div>

    <!-- Row 3: Website (optional) -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Website</label>
        <input type="url" class="form-control" id="website" name="website">
        <div class="form-text">Optional website URL for the client</div>
      </div>
    </div>

    <!-- Row 4: Active Status (optional) -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Active</label>
        <select class="form-control form-select" id="is_active" name="is_active">
          <option value="true" selected>Yes</option>
          <option value="false">No</option>
        </select>
        <div class="form-text">Whether this client is active or not</div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <a href="{% url 'clients:client_list' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Save {{ model_name }}</button>
    </div>
  </form>
  
  <script>
    document.getElementById('clientForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      // Prepare data for API
      const data = {
        name: formData.get('name'),
        website: formData.get('website') || '',
        is_active: formData.get('is_active') === 'true'
      };
      
      // Handle logo file upload
      const logoFile = formData.get('logo');
      
      try {
        let response;
        if (logoFile && logoFile.size > 0) {
          // For file uploads, we need to send form data directly
          const uploadData = new FormData();
          uploadData.append('name', formData.get('name'));
          uploadData.append('website', formData.get('website') || '');
          uploadData.append('is_active', formData.get('is_active') === 'true');
          uploadData.append('logo', logoFile);
          
          response = await fetch('{% url "clients:create_client" %}', {
            method: 'POST',
            headers: {
              'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: uploadData
          });
        } else {
          // For regular requests without file, use JSON
          response = await fetch('{% url "clients:create_client" %}', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify(data)
          });
        }
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          // Show success message
          alert('Client created successfully!');
          // Redirect to clients list page
          window.location.href = '{% url "clients:client_list" %}';
        } else {
          // Show error message
          let errorMessage = 'Failed to create client.';
          if (result.details) {
            errorMessage += ' Details: ' + JSON.stringify(result.details);
          } else if (result.error) {
            errorMessage += ' Error: ' + result.error;
          }
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while creating the client.');
      }
    });
  </script>
</div>
{% endblock %}
